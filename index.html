<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>인천공항 T2 출발 버스 시간표</title>
  <style>
    :root {
      --bg: #0c0f14;
      --card: #161b22;
      --card2: #1c222b;
      --tx: #f0f3f8;
      --sub: #8b95a5;
      --ac: #5b9cff;
      --acbg: #1a2d4a;
      --ln: #2a313c;
      --past: #4a5363;
      --highlight: #3d8bfd;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      padding: 16px;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.45;
    }

    h1 {
      font-size: 20px;
      margin: 6px 0 4px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sub {
      color: var(--sub);
      font-size: 13px;
      margin-bottom: 16px;
    }

    select {
      width: 100%;
      font-size: 16px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--ln);
      background: var(--card);
      color: var(--tx);
      margin-bottom: 6px;
      appearance: none;
    }

    button {
      font: inherit;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--ln);
      background: var(--card);
      color: var(--tx);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:active {
      background: var(--card2);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      font-weight: 500;
    }

    .tabs button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
      font-weight: 700;
    }

    /* ===== 다음 버스 박스 (가독성 강화) ===== */
    .next {
      background: linear-gradient(145deg, #1a2332 0%, #141c28 100%);
      border: 1px solid #2a3a52;
      border-radius: 18px;
      padding: 22px 18px 20px;
      margin: 16px 0 14px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .next .lb {
      color: #9eb0c7;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .next .big {
      font-size: 52px;
      font-weight: 800;
      color: #7eb6ff;
      line-height: 1.15;
      letter-spacing: -1px;
      text-shadow: 0 0 24px rgba(91, 156, 255, 0.35);
    }

    .next .rm {
      font-size: 17px;
      font-weight: 600;
      color: #e8eef7;
      margin-top: 6px;
    }

    .next .after {
      color: #8fa0b5;
      font-size: 13.5px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .next .after .rc {
      vertical-align: middle;
    }

    /* ===== 범례 ===== */
    .lg {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 8px;
      align-items: center;
    }

    .lg span {
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--card2);
      border: 1px solid var(--ln);
    }

    .rc {
      font-style: normal;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 5px;
      white-space: nowrap;
      display: inline-block;
    }

    .y {
      background: #e8ff3a !important;
      color: #14181f !important;
    }

    .y3 {
      background: #d4ff00 !important;
      color: #14181f !important;
      box-shadow: 0 0 12px rgba(212, 255, 0, 0.45);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 10px;
      font-size: 14px;
      color: var(--sub);
    }

    .row #cnt {
      font-weight: 500;
      color: #a8b4c4;
    }

    /* ===== 정류장별 그리드 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .t {
      padding: 10px 0 8px;
      text-align: center;
      border-radius: 11px;
      background: var(--card);
      border: 1px solid var(--ln);
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 600;
    }

    .t small {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--sub);
      margin-top: 2px;
    }

    .t.y small {
      color: #14181f;
    }

    .t.p {
      opacity: 0.38;
    }

    .t.n {
      background: var(--acbg);
      border-color: var(--ac);
      color: #8ec0ff;
      font-weight: 700;
      box-shadow: 0 0 0 1px rgba(91, 156, 255, 0.3);
    }

    .t.g10 { border-color: #3b82f6; }
    .t.g15 { border-color: #f59e0b; }
    .t.g20 { border-color: #ef4444; border-width: 2px; }

    /* ===== 전체 시간순 리스트 ===== */
    #all {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .r {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 13px;
      padding: 10px 12px;
    }

    .tw {
      flex: none;
      text-align: center;
      min-width: 68px;
    }

    .tm {
      display: block;
      font-weight: 700;
      font-size: 17px;
      padding: 7px 8px;
      border-radius: 10px;
      background: rgba(120, 140, 170, 0.18);
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
    }

    .vn {
      display: block;
      font-size: 11px;
      color: var(--sub);
      margin-top: 3px;
    }

    .st {
      font-size: 13px;
      color: #a0aec0;
      line-height: 1.65;
      padding-top: 2px;
    }

    .st div {
      margin-bottom: 3px;
    }

    .r.p {
      opacity: 0.38;
    }

    .r.n {
      border-color: var(--ac);
      box-shadow: 0 0 0 2px rgba(91, 156, 255, 0.22);
      background: #182234;
    }

    .r.n .tm {
      background: rgba(91, 156, 255, 0.22);
      color: #8ec0ff;
    }

    .gp {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      padding: 5px 0;
      margin: 2px 0;
      color: #c5d0e0;
    }

    .gp.g10 { background: rgba(59, 130, 246, 0.18); }
    .gp.g15 { background: rgba(245, 158, 11, 0.22); }
    .gp.g20 { background: rgba(239, 68, 68, 0.22); }

    .note {
      color: var(--sub);
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.6;
      padding: 12px 14px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--ln);
    }
  </style>
</head>
<body>
  <h1 id="ttl">인천공항 T2 출발 버스 시간표</h1>
  <div class="sub">전체 노선을 시간순으로 보거나, 정류장별로 확인하세요</div>

  <div class="tabs">
    <button id="bT1">T1 출발</button>
    <button id="bT2" class="on">T2 출발</button>
  </div>

  <div class="tabs">
    <button id="tAll" class="on">전체 시간순</button>
    <button id="tStop">정류장별</button>
  </div>

  <select id="sel" aria-label="정류장 선택" style="display:none"></select>

  <div class="next" id="next"></div>
  <div class="lg" id="lg"></div>

  <div class="row">
    <span id="cnt"></span>
    <button id="share">공유하기</button>
  </div>

  <div class="grid" id="grid" style="display:none"></div>
  <div id="all"></div>

  <div class="note">
    ※ A4000은 하행 시 라마다호텔을 경유합니다.<br>
    T1은 원본 마지막 행이 잘려 영통·망포역 23:10은 T2+20분으로 추정했습니다.<br>
    시간은 교통 상황·운행 변경에 따라 달라질 수 있으며 한국 시간(KST) 기준으로 계산합니다.
  </div>

  <script>
    // A4200 공통 시간표
    var G = "06:30 06:45 07:35 08:20 08:40 09:00 10:05 11:00 11:50 12:40 13:25 13:50 14:10 14:30 15:15 16:20 16:55 17:45 18:00 18:30 18:50 19:20 20:20 21:20 21:55 22:15 22:50";

    // 노선 데이터: [노선번호, 시간표(공백구분), 정류장목록]
    var RT = [
      ["N4000", "00:10 03:50 05:50", ["동수원", "한일타운", "의왕(고천)", "안양(범계)"]],
      ["A4000", "06:50 07:30 08:00 08:40 09:20 10:10 10:40 11:20 12:00 12:40 13:20 13:55 14:50 15:40 16:20 16:45 17:20 17:50 18:20 18:50 19:25 20:00 20:35 21:10 21:40 22:10 22:45", ["동수원", "한일타운", "인재개발원"]],
      ["A4100", "06:15 06:40 07:10 07:35 08:10 08:30 08:55 09:30 09:50 10:20 10:50 11:15 11:40 12:05 12:45 13:05 13:25 13:50 14:10 14:30 15:05 15:30 16:00 16:25 16:50 17:10 17:35 18:10 18:30 18:45 19:10 19:35 20:05 20:40 21:05 21:35 22:00 22:25 22:50", ["영통", "망포역", "래미안영통마크원1단지(신동수변공원)", "수원터미널", "수원역", "서수원터미널"]],
      ["A4100", "07:50", ["영통", "망포역", "수원역", "서수원터미널"]],
      ["A4100-1", "07:40 11:50 17:40 19:00", ["영통", "망포역", "해든호텔하이엔드수원", "매교역", "수원역", "화서역", "성균관대역"]],
      ["A4100-2", "07:00 09:15 12:30 14:55 17:55 20:25", ["영통", "망포역", "고색역", "호매실", "서수원터미널"]],
      ["A4200", G, ["군포(산본)", "금정역", "안양(범계)", "관악역"]],
      ["A4200-1", "07:15 08:00 09:35 10:30 11:35 12:20 13:15 14:40 15:50 17:20 18:15 19:45 20:50 22:35", ["군포(산본)", "안양(범계)", "안양역"]],
      ["A4400", "07:20 13:10 16:40 19:05", ["군포(산본)", "의왕(고천)", "의왕(내손동)", "인덕원역", "관악역"]]
    ];

    // 정류장 표시 순서
    var ORDER = [
      "동수원", "한일타운", "인재개발원", "의왕(고천)", "의왕(내손동)",
      "군포(산본)", "금정역", "안양(범계)", "관악역", "안양역", "인덕원역",
      "영통", "망포역", "래미안영통마크원1단지(신동수변공원)",
      "수원터미널", "수원역", "서수원터미널", "호매실", "고색역",
      "해든호텔하이엔드수원", "매교역", "화서역", "성균관대역"
    ];

    var CODES = [];
    var ST = {};
    var TM = {};
    var TERM = "T2";

    // T1 시간 계산 (T2 + 20분)
    function sh(s) {
      return s.split(" ").map(function (t) {
        var m = toMin(t) + 20;
        var h = Math.floor(m / 60);
        var n = m % 60;
        return (h < 10 ? "0" : "") + h + ":" + (n < 10 ? "0" : "") + n;
      }).join(" ");
    }

    // 데이터 구축
    function build() {
      ST = {};
      TM = {};

      RT.forEach(function (r) {
        var ts = TERM === "T1" ? sh(r[1]) : r[1];
        var ss = r[2];

        // T1의 특정 A4100 07:50 예외 처리
        if (TERM === "T1" && r[1] === "07:50") {
          ss = ["영통", "망포역", "래미안영통마크원1단지(신동수변공원)", "수원터미널", "수원역", "서수원터미널"];
        }

        if (CODES.indexOf(r[0]) < 0) CODES.push(r[0]);

        ts.split(" ").forEach(function (t) {
          (TM[t] = TM[t] || []).push([r[0], ss]);
          ss.forEach(function (s) {
            (ST[s] = ST[s] || []).push([t, r[0]]);
          });
        });
      });

      Object.keys(ST).forEach(function (s) {
        ST[s].sort(function (a, b) {
          return a[0] < b[0] ? -1 : 1;
        });
      });
    }

    // 저장된 터미널 설정 불러오기
    try {
      if (localStorage.getItem("t2bus_term") === "T1") TERM = "T1";
    } catch (e) {}

    build();

    // 노선 색상 칩
    function chip(c) {
      return '<i class="rc" style="background:hsl(' + (CODES.indexOf(c) * 40 + 10) + ',62%,42%)">' + c + '</i>';
    }

    // 동시 출발 강조 클래스
    function ycls(t) {
      var n = TM[t].length;
      return n >= 3 ? " y3" : n >= 2 ? " y" : "";
    }

    // 범례 생성
    document.getElementById("lg").innerHTML =
      '<span class="y">동시 2대</span>' +
      '<span class="y3">동시 3대+</span>' +
      '<span style="background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.35)">10분+ 간격</span>' +
      '<span style="background:rgba(245,158,11,.22);border-color:rgba(245,158,11,.35)">15분+</span>' +
      '<span style="background:rgba(239,68,68,.22);border-color:rgba(239,68,68,.35)">20분+</span>' +
      '<div style="width:100%;margin-top:4px">' + CODES.map(chip).join("") + '</div>';

    // 정류장 선택 옵션 생성
    var sel = document.getElementById("sel");
    ORDER.forEach(function (s, i) {
      var o = document.createElement("option");
      o.value = i;
      o.textContent = s;
      sel.appendChild(o);
    });

    try {
      var v = localStorage.getItem("t2bus2");
      if (v !== null && ORDER[v]) sel.value = v;
    } catch (e) {}

    // 유틸리티
    function toMin(t) {
      var a = t.split(":");
      return +a[0] * 60 + +a[1];
    }

    function nowMin() {
      var p = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Seoul",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(new Date());

      var h = 0, m = 0;
      p.forEach(function (x) {
        if (x.type === "hour") h = +x.value % 24;
        if (x.type === "minute") m = +x.value;
      });
      return h * 60 + m;
    }

    function fmt(d) {
      var h = Math.floor(d / 60);
      var m = d % 60;
      return (h ? h + "시간 " : "") + m + "분";
    }

    // 다음 버스 박스 렌더링
    function nextBox(ts, lbl, sub) {
      var n = nowMin();
      var idx = -1;

      for (var i = 0; i < ts.length; i++) {
        if (toMin(ts[i]) >= n) {
          idx = i;
          break;
        }
      }

      var box = document.getElementById("next");

      if (idx < 0) {
        box.innerHTML =
          '<div class="lb">오늘 운행 종료</div>' +
          '<div class="big">' + ts[0] + '</div>' +
          '<div class="rm">내일 첫차</div>';
      } else {
        var d = toMin(ts[idx]) - n;
        box.innerHTML =
          '<div class="lb">' + lbl + '</div>' +
          '<div class="big">' + ts[idx] + '</div>' +
          '<div class="rm">' + (d === 0 ? "곧 출발" : fmt(d) + " 후") + '</div>' +
          '<div class="after">' + sub(idx) + '</div>';
      }

      return idx;
    }

    function gapCls(g) {
      return g >= 20 ? "g20" : g >= 15 ? "g15" : "g10";
    }

    // 정류장별 보기
    function renderStop() {
      var s = ORDER[sel.value];
      var L = ST[s];
      var ts = L.map(function (x) { return x[0]; });

      var idx = nextBox(ts, "다음 버스", function (i) {
        return chip(L[i][1]) + (L[i + 1] ? " 그다음 " + L[i + 1][0] : "");
      });

      document.getElementById("cnt").textContent = s + " · 하루 " + ts.length + "회";

      document.getElementById("grid").innerHTML = L.map(function (x, i) {
        var t = x[0];
        var g = i ? toMin(t) - toMin(L[i - 1][0]) : 0;

        return '<div class="t' + ycls(t) +
          (g >= 10 ? " " + gapCls(g) : "") +
          (idx < 0 || i < idx ? " p" : "") +
          (i === idx ? " n" : "") + '">' +
          t +
          '<small>' + x[1] + '</small>' +
          (g >= 10 ? '<small>+' + g + '분</small>' : '') +
          '</div>';
      }).join("");
    }

    // 전체 시간순 보기
    function renderAll() {
      var ts = Object.keys(TM).sort();
      var idx = nextBox(ts, "다음 버스 (전체 노선)", function (i) {
        return TM[ts[i]].map(function (x) { return chip(x[0]); }).join("");
      });

      document.getElementById("cnt").textContent = "전체 " + ts.length + "개 시간대";

      var h = "";
      ts.forEach(function (t, i) {
        var E = TM[t];

        if (i > 0) {
          var g = toMin(t) - toMin(ts[i - 1]);
          if (g >= 10) {
            h += '<div class="gp ' + gapCls(g) + '">⏱ ' + g + '분 간격</div>';
          }
        }

        h += '<div class="r' +
          (idx < 0 || i < idx ? " p" : "") +
          (i === idx ? " n" : "") + '">' +
          '<span class="tw">' +
            '<span class="tm' + ycls(t) + '">' + t + '</span>' +
            '<small class="vn">' + E.length + '대</small>' +
          '</span>' +
          '<span class="st">' +
            E.map(function (e) {
              return '<div>' + chip(e[0]) + e[1].join(", ") + '</div>';
            }).join("") +
          '</span>' +
          '</div>';
      });

      document.getElementById("all").innerHTML = h;
    }

    // 터미널 전환 (T1 / T2)
    function setTerm(t) {
      TERM = t;
      build();

      document.getElementById("bT1").className = t === "T1" ? "on" : "";
      document.getElementById("bT2").className = t === "T2" ? "on" : "";

      var n = "인천공항 " + t + " 출발 버스 시간표";
      document.getElementById("ttl").textContent = n;
      document.title = n;

      try {
        localStorage.setItem("t2bus_term", t);
      } catch (e) {}

      render();
    }

    // 보기 모드 전환
    var mode = "all";

    function setMode(m) {
      mode = m;
      document.getElementById("tAll").className = m === "all" ? "on" : "";
      document.getElementById("tStop").className = m === "stop" ? "on" : "";
      render();
    }

    function render() {
      var a = mode === "all";
      sel.style.display = a ? "none" : "";
      document.getElementById("grid").style.display = a ? "none" : "";
      document.getElementById("all").style.display = a ? "" : "none";
      a ? renderAll() : renderStop();
    }

    // 이벤트 바인딩
    sel.onchange = function () {
      try {
        localStorage.setItem("t2bus2", sel.value);
      } catch (e) {}
      render();
    };

    document.getElementById("share").onclick = function () {
      var u = location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url: u }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(u).then(function () {
          alert("링크를 복사했어요");
        }).catch(function () {
          prompt("링크를 복사하세요", u);
        });
      } else {
        prompt("링크를 복사하세요", u);
      }
    };

    document.getElementById("bT1").addEventListener("click", function () { setTerm("T1"); });
    document.getElementById("bT2").addEventListener("click", function () { setTerm("T2"); });
    document.getElementById("tAll").addEventListener("click", function () { setMode("all"); });
    document.getElementById("tStop").addEventListener("click", function () { setMode("stop"); });

    // 초기 렌더링 + 30초마다 갱신
    setTerm(TERM);
    setInterval(render, 30000);
  </script>
</body>
</html>
